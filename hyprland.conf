# Hyprland configuration converted from Sway
# See https://wiki.hyprland.org/Configuring/Configuring-Hyprland/ for more

# Monitor configuration
# List your monitors with: hyprctl monitors
# Example: monitor=HDMI-A-1,1920x1080@60,1920x0,1
monitor=eDP-1,1920x1080@60,0x0,1
# monitor=HDMI-A-1, preferred, auto, 1
# monitor=HDMI-A-1, 1920x1200@59.95, auto, 1
#monitor=HDMI-A-1, highres, auto, 1
monitor=HDMI-A-1,2560x1440@60,1920x0,1
# monitor=HDMI-A-1,highrr,1920x0,1

# Execute your favorite apps at launch
# exec-once = nm-applet --indicator
exec-once = waybar --config ~/.config/waybar/config-hyprland.jsonc
exec-once = hyprpaper
exec = ~/.config/hypr/wallpaper/setbingpicofday.sh

# Idle configuration (using hypridle)
# You'll need to install hypridle and configure it separately
exec-once = hypridle

# Clipboard history manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = hyprshell -c ~/.config/hypr/hyprshell.ron completions
exec-once = hyprshell -c ~/.config/hypr/hyprshell.ron run

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = gb,hu,dk,de
    kb_variant = extd,,,
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-and-drag = true
        drag_lock = true
        tap-to-click = true
        middle_button_emulation = true
        scroll_factor = 1.0
        disable_while_typing = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
    dim_inactive = true
    dim_strength = 0.4
    inactive_opacity = 1
    # enabled = true
    rounding = 10
    rounding_power = 3
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}


misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true 
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

gesture = 3, horizontal, workspace

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Key bindings
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Q, killactive,
# bind = $mainMod, D, exec, hyprlauncher
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod, X, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Arrow keys alternative
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Arrow keys alternative for moving windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Layout bindings
bind = $mainMod, S, exec, hyprctl keyword general:layout master
bind = $mainMod, W, exec, hyprctl keyword general:layout dwindle
bind = $mainMod, F, fullscreen, 0

# Floating mode toggle
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod, space, focusurgentorlast

# Scratchpad equivalent (special workspace)
bind = $mainMod SHIFT, minus, movetoworkspace, special
bind = $mainMod, minus, togglespecialworkspace

# Resize mode (submap in Hyprland)
bind = $mainMod, R, submap, resize
submap = resize
    binde = , H, resizeactive, -10 0
    binde = , J, resizeactive, 0 10
    binde = , K, resizeactive, 0 -10
    binde = , L, resizeactive, 10 0
    binde = , left, resizeactive, -10 0
    binde = , down, resizeactive, 0 10
    binde = , up, resizeactive, 0 -10
    binde = , right, resizeactive, 10 0
    bind = , Return, submap, reset
    bind = , escape, submap, reset
submap = reset


# Clipboard history
bind = $mainMod, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy


# Volume control
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle


# Brightness control
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# Media keys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only
bind = $mainMod, Print, exec, hyprshot -m window -m active --clipboard-only
bind = , Print, exec, hyprshot -m output -m eDP-1 --clipboard-only

# Move workspace to different monitors
bind = $mainMod SHIFT CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT CTRL, right, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT CTRL, up, movecurrentworkspacetomonitor, u
bind = $mainMod SHIFT CTRL, down, movecurrentworkspacetomonitor, d

# Custom app launches
bind = $mainMod, E, exec, dolphin
bind = $mainMod, Q, exec, firefox

# Keyboard layout switching
bind = $mainMod ALT, space, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Window rules
windowrule = match:class ^file_progress$, float = on
windowrule = match:class ^confirm$, float = on
windowrule = match:class ^dialog$, float = on
windowrule = match:class ^download$, float = on
windowrule = match:class ^notification$, float = on
windowrule = match:class ^error$, float = on
windowrule = match:class ^splash$, float = on
windowrule = match:class ^confirmreset$, float = on
windowrule = match:class ^Lxappearance$, float = on
windowrule = match:class ^Rofi$, float = on
windowrule = match:class ^Rofi$, animation = none
windowrule = match:class ^viewnior$, float = on
windowrule = match:class ^Viewnior$, float = on
windowrule = match:class ^feh$, float = on
windowrule = match:class ^pavucontrol-qt$, float = on
windowrule = match:class ^pavucontrol$, float = on
windowrule = match:class ^file-roller$, float = on
windowrule = match:class ^wlogout$, fullscreen = on
windowrule = match:title ^wlogout$, float = on
windowrule = match:title ^wlogout$, fullscreen = on
windowrule = match:title ^(Media viewer)$, float = on
windowrule = match:title ^(Volume Control)$, float = on
windowrule = match:title ^(Picture-in-Picture)$, float = on
windowrule = match:title ^(Volume Control)$, size = 800 600
windowrule = match:title ^(Volume Control)$, move = 75 44%

